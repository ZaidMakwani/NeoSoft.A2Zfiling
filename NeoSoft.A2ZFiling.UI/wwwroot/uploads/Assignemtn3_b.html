<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Attributes </title>
</head>
<body>


<img src="./images/pokhara.jpg" alt="pokhara" text-align="left" width="200" height="200">
<p>This paragraph is wrapped around the image aligned to the left using the 'align' attribute.</p>

<div style="clear: both;"></div>


<img src="./images/lumbini.jpg" alt="lumbini" hspace="20" vspace="20" width="200" height="200">
<img src="./images/kathmandu.jpg" alt="kathmandu" hspace="20" vspace="20" width="200" height="200">

</body>
</html>
