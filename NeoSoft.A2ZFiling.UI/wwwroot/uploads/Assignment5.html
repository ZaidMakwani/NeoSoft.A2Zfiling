<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested list</title>
    <style>
        ul {
            list-style: none;
        }

        .subject {
            color: green;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <ul>
        <li>-B.Tech</li>
        <ul>
            <li>-2019</li>
            <li>-2022</li>
        </ul>
    </ul>


    <ul>
        <li>-M.Tech</li>
        <dl>
            <dt>-2019</dt>
            <dd class="subject">-HTML&CSS</dd>
            <dd class="subject">-Javascript</dd>
        </dl>

        <dl>

            <dt>-2022</dt>

            <dd class="subject">-Java</dd>

            <dd class="subject">-Python</dd>

</dl>
    </ul>

</body>
</html>
